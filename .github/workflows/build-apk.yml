name: 构建 APK（可选架构）

# 手动触发：Actions → 本工作流 → Run workflow
# 勾选需要的架构后即可在 GitHub 上构建 APK，构建完成后在本页下方
# Artifacts 里下载对应安装包。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（release 更小更快，debug 方便调试）'
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
      arm64_v8a:
        description: 'arm64-v8a（主流手机，几乎都支持，默认勾选）'
        required: true
        type: boolean
        default: true
      armeabi_v7a:
        description: 'armeabi-v7a（较老的 32 位手机）'
        required: true
        type: boolean
        default: true
      x86_64:
        description: 'x86_64（模拟器 / 少数平板，手机一般用不上）'
        required: true
        type: boolean
        default: false
      fat:
        description: '全架构 fat APK（一个包包含所有架构，包体最大）'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 启用 Gradle 依赖缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      # 项目依赖的 umeng_common_sdk 插件存在三个历史问题，直接构建必然失败，
      # 这里在构建前统一修复：
      #   1. jcenter 仓库已永久关停 + 动态版本（common:+ / asms:+）→ 由 init
      #      脚本移除 jcenter 并固定到 Maven Central 上的具体版本；
      #   2. 插件模块 Java/Kotlin 编译目标不一致 → 由 init 脚本统一为 17；
      #   3. 插件包内同名类 UmengCommonSdkPlugin 同时发布了 Kotlin 版
      #      (src/main/kotlin) 与 Java 版 (src/main/java)，Kotlin 编译器的源根
      #      同时覆盖两个目录，导致 Redeclaration 编译失败 → 删除 Java 副本。
      # 注意：必须先 flutter pub get 把插件解压进 pub 缓存，再删除副本；
      #       删除发生在构建前，pub 缓存里的副本只影响本次编译。
      - name: 应用 umeng 构建修复
        run: |
          flutter pub get
          mkdir -p ~/.gradle/init.d
          cp .github/gradle/umeng-jcenter-fix.gradle ~/.gradle/init.d/
          # 兜底搜索任意 pub 缓存路径（不同 runner 的 PUB_CACHE 位置可能不同）
          for base in "$HOME/.pub-cache" "$HOME/.flutter-pub-cache" /opt/hostedtoolcache "$HOME/.cache"; do
            [ -d "$base" ] || continue
            find "$base" -path "*umeng_common_sdk-1.3.1*/android/src/main/java/com/umeng/umeng_common_sdk/UmengCommonSdkPlugin.java" -delete -print
          done
          echo "构建修复已应用（jcenter / 动态版本 / JVM 目标 / 重复类声明）"

      - name: 校验至少选择一个架构
        if: ${{ inputs.arm64_v8a == 'false' && inputs.armeabi_v7a == 'false' && inputs.x86_64 == 'false' && inputs.fat == 'false' }}
        run: |
          echo "::error::请至少勾选一个架构（arm64-v8a / armeabi-v7a / x86_64 / fat）"
          exit 1

      - name: 构建 APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e
          MODE="--release"
          if [ "$BUILD_TYPE" = "debug" ]; then MODE="--debug"; fi
          echo "==> flutter build apk --split-per-abi $MODE"
          flutter build apk --split-per-abi "$MODE" \
            -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m" \
            -Pkotlin.daemon.jvmargs="-Xmx2g" \
            -Porg.gradle.workers.max=2
          if [ "${{ inputs.fat }}" = "true" ]; then
            echo "==> flutter build apk $MODE (fat)"
            flutter build apk "$MODE" \
              -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m" \
              -Pkotlin.daemon.jvmargs="-Xmx2g" \
              -Porg.gradle.workers.max=2
          fi

      - name: 整理产物
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e
          SRC="build/app/outputs/flutter-apk"
          mkdir -p dist
          cp_abi() {
            local abi="$1" name="$2"
            local f="$SRC/app-${abi}-${BUILD_TYPE}.apk"
            [ -f "$f" ] || { echo "::error::缺少产物 $f"; exit 1; }
            cp "$f" "dist/$name"
            echo "已打包 $name ($(du -h "$f" | cut -f1))"
          }
          [ "${{ inputs.arm64_v8a }}" = "true" ] && cp_abi arm64-v8a abts-arm64-v8a.apk
          [ "${{ inputs.armeabi_v7a }}" = "true" ] && cp_abi armeabi-v7a abts-armeabi-v7a.apk
          [ "${{ inputs.x86_64 }}" = "true" ] && cp_abi x86_64 abts-x86_64.apk
          [ "${{ inputs.fat }}" = "true" ] && cp "$SRC/app-${BUILD_TYPE}.apk" "dist/abts-fat.apk"
          echo "---- dist ----"
          ls -la dist

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: abts-apk-${{ inputs.build_type }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: 汇总构建信息
        run: |
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：\`$(grep '^version:' pubspec.yaml | awk '{print $2}')\`" >> $GITHUB_STEP_SUMMARY
          echo "- 构建类型：\`${{ inputs.build_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 已打包：\`$(ls dist | tr '\n' ' ')\`" >> $GITHUB_STEP_SUMMARY
          echo "- 下载：本页底部 **Artifacts** 区点击 \`abts-apk-${{ inputs.build_type }}\` 下载" >> $GITHUB_STEP_SUMMARY
