name: 构建 APK（可选架构）

# 两种触发方式：
# 1. 推送 main 分支 → 自动构建 release（arm64-v8a + armeabi-v7a），
#    完成后可在本页下方 Artifacts 下载安装包；
# 2. 手动触发：Actions → 本工作流 → Run workflow，可勾选架构/构建类型/
#    是否发布 GitHub Release。
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（release 更小更快，debug 方便调试）'
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
      arm64_v8a:
        description: 'arm64-v8a（主流手机，几乎都支持，默认勾选）'
        required: true
        type: boolean
        default: true
      armeabi_v7a:
        description: 'armeabi-v7a（较老的 32 位手机）'
        required: true
        type: boolean
        default: true
      x86_64:
        description: 'x86_64（模拟器 / 少数平板，手机一般用不上）'
        required: true
        type: boolean
        default: false
      fat:
        description: '全架构 fat APK（一个包包含所有架构，包体最大）'
        required: true
        type: boolean
        default: false
      release:
        description: '构建完成后自动发布 GitHub Release（tag 取 pubspec 版本号，如 v0.2.3）'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # workflow_dispatch 的 inputs 只在手动触发时存在；push 触发时为空，
      # 这里统一解析：push 用默认参数（release + 主流两种架构，不自动发版），
      # 手动触发用勾选值。
      - name: 解析构建参数
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "arm64=true" >> "$GITHUB_OUTPUT"
            echo "armeabi=true" >> "$GITHUB_OUTPUT"
            echo "x86=false" >> "$GITHUB_OUTPUT"
            echo "fat=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
            echo "arm64=${{ inputs.arm64_v8a }}" >> "$GITHUB_OUTPUT"
            echo "armeabi=${{ inputs.armeabi_v7a }}" >> "$GITHUB_OUTPUT"
            echo "x86=${{ inputs.x86_64 }}" >> "$GITHUB_OUTPUT"
            echo "fat=${{ inputs.fat }}" >> "$GITHUB_OUTPUT"
            echo "release=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          fi
          echo "触发方式=${{ github.event_name }} 架构=arm64:$arm64,armeabi:$armeabi,x86:$x86,fat:$fat 发版=$release"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 启用 Gradle 依赖缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      # 项目依赖的 umeng_common_sdk 插件存在三个历史问题，直接构建必然失败，
      # 这里在构建前统一修复：
      #   1. jcenter 仓库已永久关停 + 动态版本（common:+ / asms:+）→ 由 init
      #      脚本移除 jcenter 并固定到 Maven Central 上的具体版本；
      #   2. 插件模块 Java/Kotlin 编译目标不一致 → 由 init 脚本统一为 17；
      #   3. 插件包内同名类 UmengCommonSdkPlugin 同时发布了 Kotlin 版
      #      (src/main/kotlin) 与 Java 版 (src/main/java)，Kotlin 编译器的源根
      #      同时覆盖两个目录，导致 Redeclaration 编译失败 → 删除 Java 副本。
      # 注意：必须先 flutter pub get 把插件解压进 pub 缓存，再删除副本；
      #       删除发生在构建前，pub 缓存里的副本只影响本次编译。
      - name: 应用 umeng 构建修复
        run: |
          flutter pub get
          mkdir -p ~/.gradle/init.d
          cp .github/gradle/umeng-jcenter-fix.gradle ~/.gradle/init.d/
          # 兜底搜索任意 pub 缓存路径（不同 runner 的 PUB_CACHE 位置可能不同）
          for base in "$HOME/.pub-cache" "$HOME/.flutter-pub-cache" /opt/hostedtoolcache "$HOME/.cache"; do
            [ -d "$base" ] || continue
            find "$base" -path "*umeng_common_sdk-1.3.1*/android/src/main/java/com/umeng/umeng_common_sdk/UmengCommonSdkPlugin.java" -delete -print
          done
          echo "构建修复已应用（jcenter / 动态版本 / JVM 目标 / 重复类声明）"

      - name: 校验至少选择一个架构
        if: ${{ steps.params.outputs.arm64 == 'false' && steps.params.outputs.armeabi == 'false' && steps.params.outputs.x86 == 'false' && steps.params.outputs.fat == 'false' }}
        run: |
          echo "::error::请至少勾选一个架构（arm64-v8a / armeabi-v7a / x86_64 / fat）"
          exit 1

      - name: 构建 APK
        env:
          BUILD_TYPE: ${{ steps.params.outputs.build_type }}
        run: |
          set -e
          MODE="--release"
          if [ "$BUILD_TYPE" = "debug" ]; then MODE="--debug"; fi
          echo "==> flutter build apk --split-per-abi $MODE"
          flutter build apk --split-per-abi "$MODE" \
            -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m" \
            -Pkotlin.daemon.jvmargs="-Xmx2g" \
            -Porg.gradle.workers.max=2
          if [ "${{ steps.params.outputs.fat }}" = "true" ]; then
            echo "==> flutter build apk $MODE (fat)"
            flutter build apk "$MODE" \
              -Porg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m" \
              -Pkotlin.daemon.jvmargs="-Xmx2g" \
              -Porg.gradle.workers.max=2
          fi

      - name: 整理产物
        env:
          BUILD_TYPE: ${{ steps.params.outputs.build_type }}
        run: |
          set -e
          SRC="build/app/outputs/flutter-apk"
          mkdir -p dist
          cp_abi() {
            local abi="$1" name="$2"
            local f="$SRC/app-${abi}-${BUILD_TYPE}.apk"
            [ -f "$f" ] || { echo "::error::缺少产物 $f"; exit 1; }
            cp "$f" "dist/$name"
            echo "已打包 $name ($(du -h "$f" | cut -f1))"
          }
          [ "${{ steps.params.outputs.arm64 }}" = "true" ] && cp_abi arm64-v8a abts-arm64-v8a.apk
          [ "${{ steps.params.outputs.armeabi }}" = "true" ] && cp_abi armeabi-v7a abts-armeabi-v7a.apk
          [ "${{ steps.params.outputs.x86 }}" = "true" ] && cp_abi x86_64 abts-x86_64.apk
          [ "${{ steps.params.outputs.fat }}" = "true" ] && cp "$SRC/app-${BUILD_TYPE}.apk" "dist/abts-fat.apk"
          echo "---- dist ----"
          ls -la dist

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: abts-apk-${{ steps.params.outputs.build_type }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ steps.params.outputs.release }}" != "true" ]; then
            echo "未勾选 release 选项（push 自动构建默认不发布 Release），跳过"
            exit 0
          fi
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "==> Release $TAG 已存在，上传/覆盖资产"
            gh release upload "$TAG" dist/*.apk --clobber
          else
            echo "==> 创建 Release $TAG"
            gh release create "$TAG" dist/*.apk \
              --title "v${VERSION}" \
              --notes "由「构建 APK（可选架构）」工作流自动发布。勾选 release 后构建，App 内「检查更新」会检测到该版本。"
          fi
          echo "已发布：https://github.com/HExplorers-Smx/abts/releases/tag/$TAG"

      - name: 汇总构建信息
        env:
          BUILD_TYPE: ${{ steps.params.outputs.build_type }}
          TRIGGER: ${{ github.event_name }}
        run: |
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式：\`$TRIGGER\`（push 自动构建 / manual 手动构建）" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：\`$(grep '^version:' pubspec.yaml | awk '{print $2}')\`" >> $GITHUB_STEP_SUMMARY
          echo "- 构建类型：\`$BUILD_TYPE\`" >> $GITHUB_STEP_SUMMARY
          echo "- 已打包：\`$(ls dist | tr '\n' ' ')\`" >> $GITHUB_STEP_SUMMARY
          echo "- 下载：本页底部 **Artifacts** 区点击 \`abts-apk-$BUILD_TYPE\` 下载" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.params.outputs.release }}" = "true" ]; then
            echo "- 已发布 Release：https://github.com/HExplorers-Smx/abts/releases/tag/v$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> $GITHUB_STEP_SUMMARY
          fi
